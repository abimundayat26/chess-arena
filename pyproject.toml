[project]
name = "chess-arena-backend"
version = "0.1.0"
description = "Authoritative chess game API for Multi-Model Chess Arena"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-chess>=1.999,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
